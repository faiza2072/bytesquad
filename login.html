<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>REIMS — Login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      width: 100%;
    }
    .header {
      text-align: center;
      margin-bottom: 40px;
      color: #fff;
    }
    .header h1 {
      font-size: 42px;
      font-weight: 700;
      margin-bottom: 8px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.2);
    }
    .header p {
      font-size: 16px;
      opacity: 0.95;
    }
    .cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.15);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 15px 50px rgba(0,0,0,0.25);
    }
    .card-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
    .card-title {
      font-size: 22px;
      font-weight: 700;
      color: #1a202c;
      margin-bottom: 8px;
    }
    .card-desc {
      font-size: 14px;
      color: #718096;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #4a5568;
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      font-size: 14px;
      transition: border 0.2s;
    }
    .form-group input:focus {
      outline: none;
      border-color: #667eea;
    }
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-admin {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
    }
    .btn-admin:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102,126,234,0.4);
    }
    .btn-school {
      background: linear-gradient(135deg, #f093fb, #f5576c);
      color: #fff;
    }
    .btn-school:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(245,87,108,0.4);
    }
    .error {
      color: #e53e3e;
      font-size: 13px;
      margin-top: 8px;
      display: none;
    }
    .error.show { display: block; }
    @media (max-width: 768px) {
      .cards { grid-template-columns: 1fr; }
      .header h1 { font-size: 32px; }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>🏫 REIMS</h1>
    <p>Rural Education Impact & Monitoring System</p>
  </div>

  <div class="cards">
    <!-- Admin Login -->
    <div class="card">
      <div class="card-icon">🏛️</div>
      <div class="card-title">Administration Login</div>
      <div class="card-desc">Access the full monitoring dashboard with analytics, AI insights, and partnership tracking.</div>
      <form id="adminForm">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="adminUser" placeholder="admin" required />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="adminPass" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn btn-admin">Login as Admin</button>
        <div class="error" id="adminError"></div>
      </form>
    </div>

    <!-- School Login -->
    <div class="card">
      <div class="card-icon">🏫</div>
      <div class="card-title">School Portal</div>
      <div class="card-desc">School administrators can enter student data, mark attendance, and upload verification images.</div>
      <form id="schoolForm">
        <div class="form-group">
          <label>School Username</label>
          <input type="text" id="schoolUser" placeholder="sch001" required />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="schoolPass" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn btn-school">Login as School</button>
        <div class="error" id="schoolError"></div>
      </form>
    </div>
  </div>
</div>

<script>
const API = 'http://127.0.0.1:5000/api';

document.getElementById('adminForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const username = document.getElementById('adminUser').value.trim();
  const password = document.getElementById('adminPass').value.trim();
  const errEl = document.getElementById('adminError');
  errEl.classList.remove('show');

  try {
    const res = await fetch(`${API}/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (!data.success) {
      errEl.textContent = data.message || 'Invalid credentials';
      errEl.classList.add('show');
      return;
    }
    if (data.role !== 'admin') {
      errEl.textContent = 'Not an admin account';
      errEl.classList.add('show');
      return;
    }
    sessionStorage.setItem('reims_user', JSON.stringify(data));
    window.location.href = 'index.html';
  } catch (err) {
    errEl.textContent = 'Server error. Please try again.';
    errEl.classList.add('show');
  }
});

document.getElementById('schoolForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const username = document.getElementById('schoolUser').value.trim();
  const password = document.getElementById('schoolPass').value.trim();
  const errEl = document.getElementById('schoolError');
  errEl.classList.remove('show');

  try {
    const res = await fetch(`${API}/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (!data.success) {
      errEl.textContent = data.message || 'Invalid credentials';
      errEl.classList.add('show');
      return;
    }
    if (data.role !== 'school') {
      errEl.textContent = 'Not a school account';
      errEl.classList.add('show');
      return;
    }
    sessionStorage.setItem('reims_user', JSON.stringify(data));
    window.location.href = 'school-portal.html';
  } catch (err) {
    errEl.textContent = 'Server error. Please try again.';
    errEl.classList.add('show');
  }
});
</script>

</body>
</html>
